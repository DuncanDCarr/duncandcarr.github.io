<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Word Counter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="counter-container">
        <h1>Text Analyzer</h1>
        <p class="subtitle">Type or paste your text below to get real-time statistics.</p>
        
        <textarea id="text-input" placeholder="Start typing here..."></textarea>
        
        <div class="stats-grid">
            <div class="stat-box">
                <span id="word-count" class="stat-number">0</span>
                <span class="stat-label">Words</span>
            </div>
            <div class="stat-box">
                <span id="char-count" class="stat-number">0</span>
                <span class="stat-label">Characters</span>
            </div>
            <div class="stat-box">
                <span id="sentence-count" class="stat-number">0</span>
                <span class="stat-label">Sentences</span>
            </div>
            <div class="stat-box">
                <span id="paragraph-count" class="stat-number">0</span>
                <span class="stat-label">Paragraphs</span>
            </div>
        </div>
        
        <button id="clear-btn" class="clear-btn">Clear Text</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
